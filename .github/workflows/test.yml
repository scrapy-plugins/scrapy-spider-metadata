name: tox
on:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.9"
          toxenv: "min"
        - python-version: "3.9"
          toxenv: "py39"
        - python-version: "3.10"
          toxenv: "py310"
        - python-version: "3.11"
          toxenv: "py311"
        - python-version: "3.12"
          toxenv: "py312"
        - python-version: "3.13"
          toxenv: "py313"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        # The first version runs tox itself (sphinx-scrapy requires 3.10+),
        # the second one is used by the test environment.
        python-version: |
          3.13
          ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: tox
      run: |
        tox -e ${{ matrix.toxenv }}
    - name: coverage
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']  # Keep in sync with .readthedocs.yml
        tox-job: ["pre-commit", "mypy", "types", "docs", "twinecheck"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: tox
      run: |
        tox -e ${{ matrix.tox-job }}
