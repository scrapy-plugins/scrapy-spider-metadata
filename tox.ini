[tox]
requires =
    sphinx-scrapy[tox]==0.13.0
envlist = py,pre-commit,mypy,types,docs,twinecheck

[testenv]
deps =
    pytest>=9.0
    pytest-cov>=7.0
    packaging
commands =
    pytest \
        --cov-report=term --cov-report= --cov-report=xml \
        --cov-report=term-missing --cov=scrapy_spider_metadata \
        --junitxml=testenv.junit.xml -o junit_family=legacy \
        --doctest-modules \
        {posargs:scrapy_spider_metadata tests}

[testenv:min]
base_python = python3.11
deps =
    {[testenv]deps}
    pydantic==2.0
    scrapy==2.7.0
    w3lib<2

[testenv:pre-commit]
deps =
    pre-commit
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:mypy]
deps =
    mypy==2.4.0
    pydantic==2.14.1
    pytest==9.1.1
commands = mypy --strict {posargs:scrapy_spider_metadata tests}

[testenv:types]
deps =
    {[testenv]deps}
    {[testenv:mypy]deps}
    pytest-mypy-testing==0.2.0
commands =
    pytest {posargs:tests_typing}

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.6.1
commands =
    python -m build --sdist
    twine check dist/*
